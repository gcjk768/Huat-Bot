[project]
name = "huatbot"
version = "0.1.0"
description = "Singapore Pools TOTO bot: scrapes results, works out what the next draws are likely to do and where the next big prize is, checks your tickets, posts to Telegram and keeps everything in an Obsidian vault."
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
huatbot = "huatbot.cli:main"

[tool.setuptools]
packages = ["huatbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
